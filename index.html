<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Universal Converter</title>
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.0/dist/ffmpeg.min.js"></script>
    <style>
        :root { --primary: #00dc82; --bg: #080808; --card: #141414; --text: #ffffff; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: var(--card); padding: 40px; border-radius: 24px; width: 450px; text-align: center; border: 1px solid #222; }
        .step { display: none; }
        .step.active { display: block; }
        .upload-box { border: 2px dashed #333; padding: 40px; border-radius: 15px; cursor: pointer; transition: 0.3s; }
        .upload-box:hover { border-color: var(--primary); background: #1a1a1a; }
        .progress-container { width: 100%; background: #222; height: 8px; border-radius: 10px; margin: 20px 0; overflow: hidden; display: none; }
        .progress-bar { width: 0%; height: 100%; background: var(--primary); box-shadow: 0 0 15px var(--primary); transition: width 0.1s; }
        select, button { width: 100%; padding: 15px; margin-top: 15px; border-radius: 12px; border: none; font-size: 16px; }
        select { background: #222; color: white; }
        button { background: var(--primary); color: black; font-weight: bold; cursor: pointer; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .error-msg { color: #ff4d4d; background: rgba(255, 77, 77, 0.1); padding: 10px; border-radius: 8px; margin-top: 15px; display: none; border: 1px solid #ff4d4d; }
        .file-info { margin-bottom: 20px; color: var(--primary); font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div id="step1" class="step active">
        <h2>Upload File</h2>
        <div class="upload-box" onclick="document.getElementById('fileInput').click()">
            <p>Click to browse or Drag & Drop</p>
            <input type="file" id="fileInput" style="display:none">
        </div>
    </div>

    <div id="step2" class="step">
        <h2>Convert File</h2>
        <div class="file-info" id="fileNameDisplay"></div>
        <label style="font-size: 12px; color: #888;">CONVERT TO:</label>
        <select id="toFormat">
            <optgroup label="Images">
                <option value="jpg">JPG</option>
                <option value="png">PNG</option>
                <option value="webp">WebP</option>
            </optgroup>
            <optgroup label="Audio/Video">
                <option value="mp3">MP3</option>
                <option value="wav">WAV</option>
                <option value="mp4">MP4</option>
            </optgroup>
        </select>
        <div class="progress-container" id="progCont"><div class="progress-bar" id="progBar"></div></div>
        <div id="errorBox" class="error-msg"></div>
        <button id="convertBtn">Convert & Download</button>
        <button onclick="location.reload()" style="background:transparent; color:#888; font-size:12px;">Start Over</button>
    </div>
</div>

<script>
    const { createFFmpeg, fetchFile } = FFmpeg;
    const ffmpeg = createFFmpeg({ log: true });
    
    const fileInput = document.getElementById('fileInput');
    const toFormat = document.getElementById('toFormat');
    const convertBtn = document.getElementById('convertBtn');
    const errorBox = document.getElementById('errorBox');
    const progBar = document.getElementById('progBar');
    const progCont = document.getElementById('progCont');
    let selectedFile = null;

    // Load FFmpeg immediately
    (async () => {
        try { await ffmpeg.load(); } 
        catch (e) { console.error("FFmpeg Load Fail:", e); }
    })();

    fileInput.addEventListener('change', (e) => {
        selectedFile = e.target.files[0];
        if (selectedFile) {
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.add('active');
            document.getElementById('fileNameDisplay').innerText = `Selected: ${selectedFile.name}`;
        }
    });

    convertBtn.addEventListener('click', async () => {
        errorBox.style.display = 'none';
        const target = toFormat.value;
        startConversion(selectedFile, target);
    });

    function showError(msg) {
        errorBox.innerText = `⚠️ ${msg}`;
        errorBox.style.display = 'block';
        progCont.style.display = 'none';
        convertBtn.disabled = false;
    }

    async function startConversion(file, target) {
        progCont.style.display = 'block';
        convertBtn.disabled = true;
        progBar.style.width = '10%';

        const extension = file.name.split('.').pop().toLowerCase();
        const isImageTarget = ['jpg','png','webp'].includes(target);

        // ENGINE ROUTING
        if (['jpg','png','webp','jpeg'].includes(extension) && isImageTarget) {
            runCanvasEngine(file, target);
        } else {
            runFFmpegEngine(file, target);
        }
    }

    async function runCanvasEngine(file, target) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = img.width; canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                download(canvas.toDataURL(`image/${target === 'jpg' ? 'jpeg' : target}`), `converted.${target}`);
                finish();
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    async function runFFmpegEngine(file, target) {
        try {
            if (!ffmpeg.isLoaded()) await ffmpeg.load();
            
            // Track progress
            ffmpeg.setProgress(({ ratio }) => {
                progBar.style.width = (ratio * 100) + '%';
            });

            const name = file.name;
            const outName = `output.${target}`;

            // Write file to virtual memory
            ffmpeg.FS('writeFile', name, await fetchFile(file));

            // RUN COMMAND: ffmpeg -i input.mp3 output.mp4
            await ffmpeg.run('-i', name, outName);

            // Read result
            const data = ffmpeg.FS('readFile', outName);
            const url = URL.createObjectURL(new Blob([data.buffer], { type: `${target === 'mp4' ? 'video' : 'audio'}/${target}` }));
            
            download(url, outName);
            finish();
        } catch (e) {
            showError("FFmpeg Error: Browser security blocked the conversion.");
        }
    }

    function finish() {
        progBar.style.width = '100%';
        setTimeout(() => {
            convertBtn.disabled = false;
            progCont.style.display = 'none';
        }, 1000);
    }

    function download(url, name) {
        const a = document.createElement('a');
        a.href = url;
        a.download = name;
        a.click();
    }
</script>
</body>
</html>
